global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # When using: docker compose --profile mysql-metrics up -d
  # add (or keep) this job — target is down until the profile is running:
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
    # scrape_timeout keeps DOWN target noise low
    scrape_interval: 60s
    scrape_timeout: 5s
