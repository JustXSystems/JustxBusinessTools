# JustX Business Tools — Observability (Grafana LGTM + Tempo)
#
#   cd /var/www/jbt/deploy/observability
#   cp .env.example .env   # set GF_SECURITY_ADMIN_PASSWORD (+ optional MySQL exporter DSN)
#   docker compose up -d
#
# API (server/.env) for traces:
#   OTEL_ENABLED=true
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#
# Full guide: docs/OBSERVABILITY.md

services:
  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    mem_limit: 512m

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo-config.yml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    mem_limit: 384m

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 512m

  node-exporter:
    image: prom/node-exporter:v1.9.0
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped
    mem_limit: 64m

  mysqld-exporter:
    # v0.15+ no longer reads DATA_SOURCE_NAME — use my.cnf flags + MYSQLD_EXPORTER_PASSWORD
    image: prom/mysqld-exporter:v0.16.0
    command:
      - --mysqld.address=${MYSQL_EXPORTER_HOST:-host.docker.internal:3306}
      - --mysqld.username=${MYSQL_EXPORTER_USER:-jbt_exporter}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?Set MYSQL_EXPORTER_PASSWORD in deploy/observability/.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - mysql-metrics
    restart: unless-stopped
    mem_limit: 64m

  alloy:
    image: grafana/alloy:v1.7.1
    command: run /etc/alloy/config.alloy --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /home/deploy/.pm2/logs:/var/log/pm2:ro
    ports:
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-https://justxsystems.com/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_DOMAIN: ${GF_SERVER_DOMAIN:-justxsystems.com}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      - loki
      - prometheus
      - tempo
    restart: unless-stopped
    mem_limit: 384m

volumes:
  loki-data:
  prometheus-data:
  alloy-data:
  grafana-data:
  tempo-data:
