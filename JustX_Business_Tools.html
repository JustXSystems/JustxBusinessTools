<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>JustXSystems</title>
<style>
:root {
  color-scheme: dark;
  /* Neutral, desaturated base — near-black graphite, not saturated navy */
  --bg-0: #0a0b0f;
  --bg-1: #0e1015;
  --bg-2: #14161d;

  /* Glass surfaces (translucent, layered on the base) */
  --glass-1: rgba(255,255,255,0.035);
  --glass-2: rgba(255,255,255,0.055);
  --glass-3: rgba(255,255,255,0.085);
  --glass-hover: rgba(255,255,255,0.075);
  --border-hair: rgba(255,255,255,0.09);
  --border-hair-strong: rgba(255,255,255,0.16);

  /* Cyan accent (#00dfff) — Microsoft Edge-style fluent glass */
  --accent: #00dfff;
  --accent-strong: #00b8d4;
  --teal: #00dfff;
  --grad: linear-gradient(135deg, #00b8d4 0%, #00dfff 55%, #6ff0ff 100%);
  --grad-soft: linear-gradient(135deg, rgba(0,223,255,0.22) 0%, rgba(0,223,255,0.10) 100%);

  --text-hi: rgba(255,255,255,0.94);
  --text-mid: rgba(235,238,250,0.62);
  --text-low: rgba(235,238,250,0.38);

  --success: #7fe0b3;
  --warning: #f2c675;
  --danger: #ef9393;

  --radius-xl: 22px;
  --radius: 16px;
  --radius-sm: 12px;
  --radius-pill: 999px;
  --shadow-soft: 0 1px 2px rgba(0,0,0,0.2), 0 12px 28px -8px rgba(0,0,0,0.5);
  --shadow-lift: 0 4px 10px rgba(0,0,0,0.25), 0 24px 48px -12px rgba(0,0,0,0.55);

  /* backward-compat aliases so nothing else needs renaming */
  --navy-950: var(--bg-0);
  --navy-900: var(--bg-1);
  --navy-800: var(--bg-2);
  --navy-700: var(--bg-2);
  --navy-600: var(--glass-3);
  --card: var(--glass-1);
  --card-hover: var(--glass-hover);
  --border: var(--border-hair);
  --border-soft: var(--border-hair);
  --blue-500: var(--accent-strong);
  --blue-400: var(--accent);
  --cyan-400: var(--teal);
  --shadow: var(--shadow-lift);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(900px 560px at 12% -8%, rgba(0,223,255,0.10) 0%, transparent 60%),
    radial-gradient(800px 520px at 108% 6%, rgba(0,223,255,0.07) 0%, transparent 55%),
    var(--bg-0);
  color: var(--text-hi);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.008em;
}
button, input, select, textarea { font-family: inherit; }
a { color: inherit; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-hair-strong); border-radius: 8px; }

/* ---------- App shell — frosted glass topbar (Edge/macOS toolbar) ---------- */
.app-topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(10,11,15,0.55);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border-bottom: 1px solid var(--border-hair);
}
.app-topbar-inner {
  max-width: 1180px; margin: 0 auto; padding: 11px 20px;
  display: flex; align-items: center; gap: 14px;
}
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.brand img { height: 30px; width: auto; display: block; filter: drop-shadow(0 2px 10px rgba(0,223,255,0.25)); }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: var(--text-hi); }
.brand-sub { font-size: 10px; color: var(--text-low); font-weight: 600; letter-spacing: 0.08em; }
.topbar-spacer { flex: 1; }
.topbar-btn {
  display: flex; align-items: center; gap: 7px;
  background: var(--glass-2); border: 1px solid var(--border-hair);
  color: var(--text-hi); border-radius: var(--radius-pill); padding: 8px 16px 8px 12px;
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.topbar-btn:hover { background: var(--glass-hover); border-color: var(--border-hair-strong); }
.topbar-btn:active { transform: scale(0.97); }
.topbar-icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--glass-2); border: 1px solid var(--border-hair);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 15px; color: var(--text-hi); position: relative;
  transition: background 0.15s ease, transform 0.1s ease;
}
.topbar-icon-btn:hover { background: var(--glass-hover); }
.topbar-icon-btn:active { transform: scale(0.94); }
.notif-dot {
  position: absolute; top: 6px; right: 7px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--teal); border: 2px solid var(--bg-0);
}

.page-shell { max-width: 1180px; margin: 0 auto; padding: 24px 20px 90px; }

/* ---------- Home screen ---------- */
.home-hero {
  border-radius: var(--radius-xl); padding: 32px 32px 28px;
  background: linear-gradient(165deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid var(--border-hair);
  box-shadow: var(--shadow-soft);
  margin-bottom: 26px;
  position: relative; overflow: hidden;
}
.home-hero::after {
  content: ""; position: absolute; right: -80px; top: -100px; width: 320px; height: 320px;
  background: radial-gradient(circle, rgba(0,223,255,0.14) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero::before {
  content: ""; position: absolute; left: -60px; bottom: -120px; width: 280px; height: 280px;
  background: radial-gradient(circle, rgba(0,223,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.home-hero-greeting { font-size: 11.5px; color: var(--teal); font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; }
.home-hero-title { font-size: 25px; font-weight: 700; margin: 8px 0 5px; letter-spacing: -0.02em; }
.home-hero-sub { font-size: 13.5px; color: var(--text-mid); max-width: 520px; line-height: 1.5; }
.search-box {
  margin-top: 20px; display: flex; align-items: center; gap: 10px;
  background: var(--glass-2); border: 1px solid var(--border-hair);
  border-radius: var(--radius-pill); padding: 12px 18px; max-width: 480px;
  transition: border-color 0.15s ease, background 0.15s ease;
}
.search-box:focus-within { border-color: var(--border-hair-strong); background: var(--glass-3); }
.search-box input {
  flex: 1; background: none; border: none; outline: none; color: var(--text-hi); font-size: 13.5px;
}
.search-box input::placeholder { color: var(--text-low); }

.quick-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.quick-chip {
  background: var(--grad-soft); border: 1px solid rgba(0,223,255,0.28);
  color: var(--teal); font-size: 12px; font-weight: 700; padding: 8px 16px;
  border-radius: var(--radius-pill); cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: filter 0.15s ease;
}
.quick-chip:hover { filter: brightness(1.15); }

.category-block { margin-bottom: 30px; }
.category-head {
  display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px; padding-left: 2px;
}
.category-title { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
.category-count {
  font-size: 10.5px; color: var(--text-low); font-weight: 700; background: var(--glass-2);
  padding: 2px 9px; border-radius: var(--radius-pill); border: 1px solid var(--border-hair);
}
.tool-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 13px;
}
.tool-card {
  background: linear-gradient(165deg, rgba(0,223,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
  border: 1px solid var(--border-hair); border-radius: var(--radius);
  padding: 22px 12px 18px; cursor: pointer; text-align: center; display: flex; flex-direction: column;
  align-items: center; gap: 13px;
  transition: transform 0.16s cubic-bezier(.2,.8,.2,1), border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
}
.tool-card:hover {
  background: linear-gradient(165deg, rgba(0,223,255,0.12) 0%, rgba(255,255,255,0.03) 100%);
  border-color: rgba(0,223,255,0.4);
  transform: translateY(-3px); box-shadow: var(--shadow-soft), 0 0 0 1px rgba(0,223,255,0.15);
}
.tool-card:active { transform: translateY(-1px) scale(0.98); }
.tool-icon {
  width: 52px; height: 52px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; background: rgba(0,223,255,0.1); border: 1px solid rgba(0,223,255,0.28); flex-shrink: 0;
  box-shadow: 0 0 20px -6px rgba(0,223,255,0.35);
}
.tool-name { font-size: 12.5px; font-weight: 600; line-height: 1.3; letter-spacing: -0.003em; }
.tool-desc { font-size: 11.5px; color: var(--text-low); line-height: 1.4; }
.tool-badge {
  align-self: flex-start; font-size: 9.5px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--text-low); background: var(--glass-2); border-radius: var(--radius-pill); padding: 2px 9px;
}

/* ---------- Tool screen chrome ---------- */
.tool-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.wrap-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
@media (max-width: 900px) { .wrap-2col { grid-template-columns: 1fr; } }
.col-right { position: sticky; top: 84px; }
@media (max-width: 900px) { .col-right { position: static; } }

.back-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--glass-2); border: 1px solid var(--border-hair);
  display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; color: var(--text-hi);
  flex-shrink: 0; transition: background 0.15s ease, transform 0.1s ease;
}
.back-btn:hover { background: var(--glass-hover); }
.back-btn:active { transform: scale(0.94); }
.tool-header-text { flex: 1; }
.tool-header-title { font-size: 19px; font-weight: 700; letter-spacing: -0.015em; }
.tool-header-sub { font-size: 12px; color: var(--text-low); margin-top: 2px; }

.panel {
  background: var(--glass-1); border: 1px solid var(--border-hair); border-radius: var(--radius);
  padding: 19px; box-shadow: var(--shadow-soft);
}
.panel + .panel { margin-top: 14px; }
.panel-title { font-size: 12.5px; font-weight: 700; margin: 0 0 13px; display: flex; align-items: center; gap: 8px;
  letter-spacing: 0.01em; color: var(--text-hi); text-transform: uppercase; opacity: 0.85; }

.field { display: block; margin-bottom: 13px; }
.field span.label { display: block; font-size: 11.5px; font-weight: 600; color: var(--text-mid); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--glass-2); border: 1px solid var(--border-hair); border-radius: var(--radius-sm);
  padding: 10px 13px; color: var(--text-hi); font-size: 13px; outline: none; color-scheme: dark;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.field select option { background: #1a1c24; color: var(--text-hi); }
.field input::placeholder, .field textarea::placeholder { color: var(--text-low); }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: rgba(0,223,255,0.55); background: var(--glass-3); box-shadow: 0 0 0 4px rgba(0,223,255,0.12);
}
.field-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.field-row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
@media (max-width: 640px) {
  .field-row2, .field-row3, .field-row4 { grid-template-columns: 1fr 1fr; }
}

/* ---------- Buttons — pill-shaped, soft gradients (Edge/YouTube chip language) ---------- */
.btn {
  border: none; border-radius: var(--radius-pill); padding: 12px 20px; font-size: 13px; font-weight: 600;
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  transition: transform 0.1s ease, filter 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  letter-spacing: -0.005em;
}
.btn:active { transform: scale(0.97); }
.btn-block { width: 100%; }
.btn-primary { background: var(--grad); color: #0b0d13; font-weight: 700; box-shadow: 0 6px 20px -6px rgba(0,223,255,0.5); }
.btn-primary:hover { filter: brightness(1.06); box-shadow: 0 8px 24px -6px rgba(0,223,255,0.6); }
.btn-secondary { background: var(--glass-2); color: var(--text-hi); border: 1px solid var(--border-hair); }
.btn-secondary:hover { background: var(--glass-hover); border-color: var(--border-hair-strong); }
.btn-danger { background: rgba(239,147,147,0.12); color: var(--danger); border: 1px solid rgba(239,147,147,0.28); }
.btn-danger:hover { background: rgba(239,147,147,0.2); }
.btn-ghost { background: none; color: var(--teal); border: 1px dashed rgba(0,223,255,0.4); }
.btn-ghost:hover { background: rgba(0,223,255,0.08); }
.btn-sm { padding: 8px 14px; font-size: 11.5px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- Line items table (documents) ---------- */
.items-editor { display: flex; flex-direction: column; gap: 10px; }
.item-row-card {
  background: var(--glass-2); border: 1px solid var(--border-hair); border-radius: var(--radius-sm); padding: 14px;
  position: relative;
}
.item-row-card .remove-x {
  position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-low);
  cursor: pointer; font-size: 14px; width: 22px; height: 22px; border-radius: 50%; transition: background 0.15s ease, color 0.15s ease;
}
.item-row-card .remove-x:hover { color: var(--danger); background: rgba(239,147,147,0.12); }
.item-index {
  width: 20px; height: 20px; border-radius: 50%; background: var(--grad); color: #0b0d13; font-size: 10.5px;
  font-weight: 800; display: flex; align-items: center; justify-content: center; margin-bottom: 9px;
}

/* ---------- Preview document (kept crisp white/print-like — unaffected by dark theme) ---------- */
.doc-preview {
  background: #fff; color: #17213f; border-radius: var(--radius); padding: 26px;
  box-shadow: var(--shadow-lift);
}
.doc-preview .dp-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--blue-500); padding-bottom: 12px; }
.doc-preview .dp-logo { height: 42px; margin-bottom: 6px; }
.doc-preview .dp-company-name { font-weight: 800; font-size: 18px; color: var(--blue-500); }
.doc-preview p { margin: 2px 0; font-size: 11.5px; }
.doc-preview .dp-title-bar { background: #eef3ff; text-align: center; padding: 8px; border-radius: 6px; margin: 14px 0; font-weight: 800; font-size: 16px; letter-spacing: 0.03em; }
.doc-preview table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
.doc-preview th, .doc-preview td { border: 1px solid #dbe3f5; padding: 6px 7px; }
.doc-preview th { background: #eef3ff; text-align: left; }
.doc-preview td.num, .doc-preview th.num { text-align: right; }
.doc-two-col { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #dbe3f5; border-radius: 6px; overflow: hidden; margin-top: 10px; }
.doc-two-col > div { padding: 10px 12px; font-size: 11.5px; }
.doc-two-col > div:first-child { border-right: 1px solid #dbe3f5; }
.doc-box-title { background: #eef3ff; font-weight: 800; text-align: center; padding: 6px; font-size: 11.5px; }

/* ---------- Empty state ---------- */
.empty-state { text-align: center; padding: 46px 20px; color: var(--text-low); }
.empty-state .es-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.7; }
.empty-state .es-title { font-size: 14px; font-weight: 700; color: var(--text-mid); margin-bottom: 4px; }
.empty-state .es-sub { font-size: 12px; }

/* ---------- List / Tracker table ---------- */
.tracker-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; flex-wrap: wrap; }
.tracker-list { display: flex; flex-direction: column; gap: 10px; }
.tracker-row {
  background: var(--glass-1); border: 1px solid var(--border-hair); border-radius: var(--radius-sm); padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.tracker-row:hover { background: var(--glass-hover); border-color: var(--border-hair-strong); }
.tracker-row-main { display: flex; flex-direction: column; gap: 3px; min-width: 160px; }
.tracker-row-title { font-size: 13px; font-weight: 700; }
.tracker-row-sub { font-size: 11px; color: var(--text-low); }
.tracker-row-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; }
.tracker-row-meta .m-lbl { color: var(--text-low); font-size: 10px; display: block; }
.tracker-row-meta .m-val { font-weight: 700; }
.tracker-actions { display: flex; gap: 6px; }
.pill {
  font-size: 10.5px; font-weight: 700; padding: 4px 12px; border-radius: var(--radius-pill); text-transform: capitalize;
  border: 1px solid transparent;
}
.pill-success { background: rgba(127,224,179,0.12); color: var(--success); border-color: rgba(127,224,179,0.25); }
.pill-warning { background: rgba(242,198,117,0.12); color: var(--warning); border-color: rgba(242,198,117,0.25); }
.pill-danger { background: rgba(239,147,147,0.12); color: var(--danger); border-color: rgba(239,147,147,0.25); }
.pill-neutral { background: var(--glass-2); color: var(--text-mid); border-color: var(--border-hair); }

/* ---------- Modal — frosted glass dialog ---------- */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(5,6,10,0.55); z-index: 100;
  align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(6px);
}
.modal-box {
  background: rgba(20,22,29,0.88); backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--border-hair-strong); border-radius: var(--radius-xl); padding: 24px;
  max-width: 460px; width: 100%; box-shadow: var(--shadow-lift); max-height: 88vh; overflow-y: auto;
}
.modal-title { font-weight: 700; font-size: 15px; margin: 0 0 7px; letter-spacing: -0.01em; }
.modal-msg { font-size: 12.5px; color: var(--text-mid); margin: 0 0 6px; line-height: 1.55; }
.modal-list { font-size: 12px; color: var(--text-mid); padding-left: 18px; margin: 8px 0; max-height: 240px; overflow-y: auto; }
.modal-list li { margin-bottom: 4px; }
.modal-btns { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

/* ---------- Toast ---------- */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(20,22,29,0.9); backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--border-hair-strong); color: var(--text-hi);
  padding: 13px 22px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; z-index: 200;
  box-shadow: var(--shadow-lift); opacity: 0; pointer-events: none; transition: all 0.28s cubic-bezier(.2,.8,.2,1);
  display: flex; align-items: center; gap: 8px;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Calculator result ---------- */
.result-box {
  background: var(--grad-soft);
  border: 1px solid rgba(0,223,255,0.22); border-radius: var(--radius); padding: 20px; text-align: center;
  margin-top: 6px;
}
.result-value { font-size: 27px; font-weight: 700; color: var(--text-hi); letter-spacing: -0.02em; }
.result-label { font-size: 11.5px; color: var(--text-mid); margin-top: 4px; font-weight: 600; }
.result-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
.result-grid .rg-item { background: rgba(255,255,255,0.05); border: 1px solid var(--border-hair); border-radius: var(--radius-sm); padding: 11px; }
.result-grid .rg-val { font-size: 15px; font-weight: 700; }
.result-grid .rg-lbl { font-size: 10.5px; color: var(--text-low); margin-top: 2px; }

.section-note { font-size: 11.5px; color: var(--text-low); margin: -4px 0 12px; line-height: 1.55; }
.logo-upload-row { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.logo-preview { width: 62px; height: 62px; border-radius: var(--radius-sm); background: var(--glass-2); border: 1px solid var(--border-hair);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

/* ---------- Business Profile hero ---------- */
.profile-hero { background: linear-gradient(150deg, rgba(0,223,255,0.08) 0%, rgba(0,223,255,0.05) 100%); }
.profile-hero-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.logo-preview-lg {
  width: 84px; height: 84px; border-radius: 20px; background: var(--glass-2); border: 1px solid var(--border-hair-strong);
  display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;
  font-size: 30px; box-shadow: var(--shadow-soft);
}
.logo-preview-lg img { width: 100%; height: 100%; object-fit: contain; }
.profile-hero-info { flex: 1; min-width: 240px; }
.business-name-input {
  width: 100%; max-width: 420px; background: transparent; border: none; border-bottom: 2px solid var(--border-hair-strong);
  color: var(--text-hi); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; padding: 4px 2px 8px;

<script>
/* =======================================================================
   JustXSystems — core.js
   Storage, state, routing, home dashboard, business profile
   ======================================================================= */

/* ---------------- storage ---------------- */
function hasStorage() { return typeof window.storage !== "undefined" && window.storage; }
async function kvGet(key, fallback) {
  if (!hasStorage()) return fallback;
  try { const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
  catch (e) { return fallback; }
}
async function kvSet(key, value) {
  if (!hasStorage()) return false;
  try { await window.storage.set(key, JSON.stringify(value), false); return true; }
  catch (e) { return false; }
}
async function kvDelete(key) {
  if (!hasStorage()) return false;
  try { await window.storage.delete(key, false); return true; } catch (e) { return false; }
}
async function listGet(listKey) { return await kvGet(listKey, []); }
async function listUpsert(listKey, entry) {
  const list = await listGet(listKey);
  const idx = list.findIndex(x => x.id === entry.id);
  if (idx >= 0) list[idx] = entry; else list.unshift(entry);
  await kvSet(listKey, list);
  return list;
}
async function listDelete(listKey, id) {
  const list = await listGet(listKey);
  await kvSet(listKey, list.filter(x => x.id !== id));
}
function newId(prefix) { return `${prefix}_${Date.now()}_${Math.floor(Math.random()*9999)}`; }

/* ---------------- utils ---------------- */
function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function fmtINR(n) {
  n = Number(n) || 0;
  return n.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function todayISO() { return new Date().toISOString().slice(0,10); }
function fmtDate(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}
const ONES = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten",
  "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
const TENS = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
function twoDigitWords(n) {
  if (n === 0) return "";
  if (n < 20) return ONES[n];
  const t = Math.floor(n/10), o = n%10;
  return TENS[t] + (o ? " " + ONES[o] : "");
}
function threeDigitWords(n) {
  let str = "";
  if (n >= 100) { str += ONES[Math.floor(n/100)] + " Hundred"; n %= 100; if (n) str += " "; }
  str += twoDigitWords(n);
  return str;
}
function numberToWordsIndian(num) {
  num = Math.round(num);
  if (num === 0) return "Zero";
  let crore = Math.floor(num/10000000); num %= 10000000;
  let lakh = Math.floor(num/100000); num %= 100000;
  let thousand = Math.floor(num/1000); num %= 1000;
  let hundred = num;
  const parts = [];
  if (crore) parts.push(threeDigitWords(crore) + " Crore");
  if (lakh) parts.push(threeDigitWords(lakh) + " Lakh");
  if (thousand) parts.push(threeDigitWords(thousand) + " Thousand");
  if (hundred) parts.push(threeDigitWords(hundred));
  return parts.join(" ");
}
function sanitizeFile(s) {
  return String(s||"").trim().replace(/[\/\\:*?"<>|]+/g,"-").replace(/\s+/g,"_").replace(/-{2,}/g,"-");
}
function currentFYMonth(dateStr) {
  const d = dateStr ? new Date(dateStr) : new Date();
  return { y: d.getFullYear(), m: String(d.getMonth()+1).padStart(2,"0") };
}

const INDIAN_STATES = [
  ["Jammu and Kashmir","01"], ["Himachal Pradesh","02"], ["Punjab","03"], ["Chandigarh","04"],
  ["Uttarakhand","05"], ["Haryana","06"], ["Delhi","07"], ["Rajasthan","08"], ["Uttar Pradesh","09"],
  ["Bihar","10"], ["Sikkim","11"], ["Arunachal Pradesh","12"], ["Nagaland","13"], ["Manipur","14"],
  ["Mizoram","15"], ["Tripura","16"], ["Meghalaya","17"], ["Assam","18"], ["West Bengal","19"],
  ["Jharkhand","20"], ["Odisha","21"], ["Chhattisgarh","22"], ["Madhya Pradesh","23"], ["Gujarat","24"],
  ["Dadra and Nagar Haveli and Daman and Diu","26"], ["Maharashtra","27"], ["Karnataka","29"],
  ["Goa","30"], ["Lakshadweep","31"], ["Kerala","32"], ["Tamil Nadu","33"], ["Puducherry","34"],
  ["Andaman and Nicobar Islands","35"], ["Telangana","36"], ["Andhra Pradesh","37"], ["Ladakh","38"],
  ["Other Territory","97"]
];
function stateOptions(current) {
  return `<option value="" ${!current?"selected":""}>-- Select State --</option>` +
    INDIAN_STATES.map(([n]) => `<option value="${n}" ${current===n?"selected":""}>${n}</option>`).join("");
}

/* ---------------- toast / modal ---------------- */
function toast(msg, ms) {
  let t = document.getElementById("jbtToast");
  if (!t) { t = document.createElement("div"); t.id = "jbtToast"; t.className = "toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove("show"), ms || 2600);
}
function showModal(opts) {
  let m = document.getElementById("jbtModal");
  if (!m) { m = document.createElement("div"); m.id = "jbtModal"; m.className = "modal-overlay"; document.body.appendChild(m); }
  const bodyHtml = opts.lines
    ? `<ul class="modal-list">${opts.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`
    : (opts.message ? `<p class="modal-msg">${esc(opts.message)}</p>` : "");
  m.innerHTML = `
    <div class="modal-box">
      ${opts.title ? `<p class="modal-title">${esc(opts.title)}</p>` : ""}
      ${bodyHtml}
      <div class="modal-btns">
        ${opts.onConfirm ? `<button class="btn btn-secondary btn-sm" id="jbtModalCancel">${esc(opts.cancelText||"Cancel")}</button>` : ""}
        <button class="btn btn-primary btn-sm" id="jbtModalOk">${esc(opts.confirmText||"OK")}</button>
      </div>
    </div>`;
  m.style.display = "flex";
  document.getElementById("jbtModalOk").onclick = () => { m.style.display = "none"; if (opts.onConfirm) opts.onConfirm(); };
  const c = document.getElementById("jbtModalCancel");
  if (c) c.onclick = () => { m.style.display = "none"; };
}

function filterTools(q) {
  q = q.trim().toLowerCase();
  const wrap = document.getElementById("toolCategories");
  const countLabel = document.getElementById("toolCountLabel");
  const tools = uniqueTools();
  if (!q) {
    if (countLabel) countLabel.textContent = tools.length + " tools";
    wrap.innerHTML = `<div class="tool-grid">${tools.map(t => `
      <button class="tool-card" onclick="go('${t.id}')">
        <div class="tool-icon">${t.icon}</div>
        <div class="tool-name">${esc(t.name)}</div>
      </button>`).join("")}</div>`;
    return;
  }
  const matches = tools.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
  if (countLabel) countLabel.textContent = matches.length + " tools";
  wrap.innerHTML = matches.length ? `
    <div class="tool-grid">${matches.map(t => `
      <button class="tool-card" onclick="go('${t.id}')">
        <div class="tool-icon">${t.icon}</div>

}

<script>
/* =======================================================================
   Generic Document Creator Engine
   Powers: Quotation, Sales Order, Invoice, Purchase Order
   ======================================================================= */
const DOCUMENT_CONFIGS = {
  quotation: {
    key: "quotation", title: "Quotation Creator", docLabel: "QUOTATION", prefix: "QTN",
    partyLabel: "Customer", partyIcon: "🙍", dateLabel: "Quotation Date", extraDateLabel: "Valid Till",
    listKey: "jbt:quotation:list", docKeyPrefix: "jbt:quotation:doc:", showTax: true,
    subtitle: "Send a professional quote in under a minute.",
  },
  salesorder: {
    key: "salesorder", title: "Sales Order Creator", docLabel: "SALES ORDER", prefix: "SO",
    partyLabel: "Customer", partyIcon: "🙍", dateLabel: "Order Date", extraDateLabel: "Expected Delivery",
    listKey: "jbt:salesorder:list", docKeyPrefix: "jbt:salesorder:doc:", showTax: true,
    subtitle: "Confirm what the customer has agreed to buy.",
  },
  invoice: {
    key: "invoice", title: "Invoice Creator", docLabel: "TAX INVOICE", prefix: "INV",
    partyLabel: "Customer", partyIcon: "🙍", dateLabel: "Invoice Date", extraDateLabel: "Due Date",
    listKey: "jbt:invoice:list", docKeyPrefix: "jbt:invoice:doc:", showTax: true,
    subtitle: "GST-ready tax invoice, saved to Payment Tracker automatically.",
  },
  po: {
    key: "po", title: "Purchase Order (PO) Creator", docLabel: "PURCHASE ORDER", prefix: "PO",
    partyLabel: "Vendor", partyIcon: "🏭", dateLabel: "PO Date", extraDateLabel: "Expected By",
    listKey: "jbt:po:list", docKeyPrefix: "jbt:po:doc:", showTax: true,
    subtitle: "Order stock or materials from a vendor.",
  },
};

let DOC_STATE = null;
let DOC_CFG = null;
let DOC_VIEW = "edit"; // 'edit' | 'list'
let DOC_ITEM_SEQ = 1;

function blankDocState(cfg) {
  const n = seqCounters[cfg.key] = (seqCounters[cfg.key] || 0) + 1;
  const { y, m } = currentFYMonth(todayISO());
  DOC_ITEM_SEQ = 2;
  return {
    id: null,
    docNo: `${cfg.prefix}/${y}/${m}/${1000 + n}`,
    docDate: todayISO(),
    extraDate: todayISO(),
    party: { name: "", address: "", phone: "", gstin: "", state: "" },
    items: [{ id: 1, name: "", hsn: "", qty: 1, unit: "NOS", rate: 0 }],
    igstPct: 18, cgstPct: 0, sgstPct: 0, cgstSgstEnabled: false,
    notes: "",
    status: "draft",
  };
}

function docComputeTotals(state) {
  const computed = state.items.map(it => {
    const qty = Number(it.qty) || 0, rate = Number(it.rate) || 0;
    const taxable = qty * rate;
    const cgstAmt = taxable * (Number(state.cgstPct)||0) / 100;
    const sgstAmt = taxable * (Number(state.sgstPct)||0) / 100;
    const igstAmt = taxable * (Number(state.igstPct)||0) / 100;
    const total = taxable + cgstAmt + sgstAmt + igstAmt;
    return { ...it, qty, rate, taxable, cgstAmt, sgstAmt, igstAmt, total };
  });
  const totalQty = computed.reduce((s,i)=>s+i.qty,0);
  const taxable = computed.reduce((s,i)=>s+i.taxable,0);
  const cgst = computed.reduce((s,i)=>s+i.cgstAmt,0);
  const sgst = computed.reduce((s,i)=>s+i.sgstAmt,0);
  const igst = computed.reduce((s,i)=>s+i.igstAmt,0);
  const totalTax = cgst+sgst+igst;
  const grand = taxable + totalTax;
  return { computed, totalQty, taxable, cgst, sgst, igst, totalTax, grand };
}

function docFilename(cfg, state) {
  const party = state.party.name || "Party";
  return `${sanitizeFile(state.docNo)}_${sanitizeFile(party)}`;
}

function docMissingFields(state) {
  const missing = [];
  if (!PROFILE.businessName.trim()) missing.push("Set up your Business Profile first (name required)");
  if (!state.party.name.trim()) missing.push(`${DOC_CFG.partyLabel} name`);
  if (!state.items.length) missing.push("At least one item");
  state.items.forEach((it,i) => {
    if (!String(it.name).trim()) missing.push(`Item ${i+1} — name`);
    if (!it.rate || Number(it.rate) <= 0) missing.push(`Item ${i+1} — rate`);
  });
  return missing;
}

function openDocumentTool(toolId, params) {
  DOC_CFG = DOCUMENT_CONFIGS[toolId];
  DOC_VIEW = (params && params.view) || "edit";
  if (params && params.editId) {
    loadDocFromStorage(DOC_CFG, params.editId).then(loaded => {
      DOC_STATE = loaded || blankDocState(DOC_CFG);
      rerenderDocScreen();
    });
    DOC_STATE = blankDocState(DOC_CFG);
  } else if (!DOC_STATE || DOC_STATE.__cfgKey !== DOC_CFG.key) {
    DOC_STATE = blankDocState(DOC_CFG);
    DOC_STATE.__cfgKey = DOC_CFG.key;
  }
  return renderDocScreen();
}
function rerenderDocScreen() {
  const shell = document.getElementById("pageShell");
  if (shell) shell.innerHTML = renderDocScreen();
}
async function loadDocFromStorage(cfg, id) {
  const snap = await kvGet(cfg.docKeyPrefix + id, null);
  return snap;
}

function renderDocScreen() {
  if (DOC_VIEW === "list") return renderDocList();
  return renderDocEditor();
}

function renderDocList() {
  const cfg = DOC_CFG;
  window.__jbtAfterRender = loadDocListBody;
  return `
    <div class="tool-header">
      <button class="back-btn" onclick="go('${cfg.key}')">←</button>
      <div class="tool-header-text">
        <div class="tool-header-title">Saved ${esc(cfg.docLabel)}S</div>
        <div class="tool-header-sub">Everything you've saved with this tool.</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="go('${cfg.key}')">+ New</button>
    </div>
    <div id="docListBody"><div class="empty-state"><div class="es-icon">⏳</div><div class="es-title">Loading...</div></div></div>
  `;
}
async function loadDocListBody() {
  const cfg = DOC_CFG;
  const el = document.getElementById("docListBody");
  if (!el) return;
  if (!hasStorage()) { el.innerHTML = emptyStorageNote(); return; }
  const list = await listGet(cfg.listKey);
  if (!list.length) { el.innerHTML = `<div class="empty-state"><div class="es-icon">📄</div><div class="es-title">Nothing saved yet</div><div class="es-sub">Create your first ${esc(cfg.docLabel.toLowerCase())} to see it here.</div></div>`; return; }
  el.innerHTML = `<div class="tracker-list">${list.map(d => `
    <div class="tracker-row">
      <div class="tracker-row-main">
        <div class="tracker-row-title">${esc(d.docNo)}</div>
        <div class="tracker-row-sub">${esc(d.partyName)} · ${fmtDate(d.docDate)}</div>
      </div>
      <div class="tracker-row-meta">
        <div><span class="m-lbl">Amount</span><span class="m-val">₹${fmtINR(d.grandTotal)}</span></div>
        <div><span class="m-lbl">Status</span><span class="pill pill-${d.status==='sent'?'success':'neutral'}">${esc(d.status)}</span></div>

/* ---------- doc mutation handlers ---------- */
function docUpdateTop(field, value) { DOC_STATE[field] = value; docRerenderPreview(); }
function docUpdateParty(field, value) { DOC_STATE.party[field] = value; docRerenderPreview(); }
function docUpdateItem(id, field, value) {
  const it = DOC_STATE.items.find(i => i.id === id);
  if (it) it[field] = value;
  docRerenderPreview();
}
function docAddItem() {
  DOC_STATE.items.push({ id: DOC_ITEM_SEQ++, name: "", hsn: "", qty: 1, unit: "NOS", rate: 0 });
  rerenderDocScreen();
}
function docRemoveItem(id) {
  DOC_STATE.items = DOC_STATE.items.filter(i => i.id !== id);
  rerenderDocScreen();
}
function docToggleCgstSgst(checked) {
  DOC_STATE.cgstSgstEnabled = checked;
  if (!checked) { DOC_STATE.cgstPct = 0; DOC_STATE.sgstPct = 0; }
  rerenderDocScreen();
}
function docRerenderPreview() {
  const cfg = DOC_CFG, s = DOC_STATE;
  const { computed, totalQty, taxable, cgst, sgst, igst, totalTax, grand } = docComputeTotals(s);
  const wordsTotal = grand > 0 ? numberToWordsIndian(Math.floor(grand)) + " Rupees Only" : "Zero Rupees Only";
  const box = document.getElementById("docPreviewBox");
  if (box) box.innerHTML = renderDocPreviewInner(cfg, s, computed, totalQty, taxable, cgst, sgst, igst, totalTax, grand, wordsTotal);
}

async function docSave() {
  const missing = docMissingFields(DOC_STATE);
  if (missing.length) { showModal({ title: "A few things are missing:", lines: missing, confirmText: "OK" }); return; }
  if (!DOC_STATE.id) DOC_STATE.id = newId(DOC_CFG.key);
  const { grand } = docComputeTotals(DOC_STATE);
  DOC_STATE.status = "saved";
  await kvSet(DOC_CFG.docKeyPrefix + DOC_STATE.id, DOC_STATE);
  await listUpsert(DOC_CFG.listKey, {
    id: DOC_STATE.id, docNo: DOC_STATE.docNo, partyName: DOC_STATE.party.name,
    docDate: DOC_STATE.docDate, grandTotal: grand, status: DOC_STATE.status
  });
  if (DOC_CFG.key === "invoice") await syncInvoiceToPaymentTracker(DOC_STATE, grand);
  toast(`✔ ${DOC_CFG.docLabel} saved`);
}
function docPrint() {
  const missing = docMissingFields(DOC_STATE);
  if (missing.length) { showModal({ title: "Save first — a few things are missing:", lines: missing, confirmText: "OK" }); return; }
  document.title = docFilename(DOC_CFG, DOC_STATE);
  window.print();
}
function docReset() {
  showModal({
    title: `Start a new ${DOC_CFG.docLabel.toLowerCase()}?`, message: "Unsaved changes will be lost.",
    confirmText: "Start New", cancelText: "Cancel",
    onConfirm: () => { DOC_STATE = blankDocState(DOC_CFG); DOC_STATE.__cfgKey = DOC_CFG.key; rerenderDocScreen(); }
  });
}

async function syncInvoiceToPaymentTracker(inv, grand) {
  await listUpsert("jbt:paymenttracker:list", {
    id: "recv_" + inv.id,
    kind: "Receivable",
    party: inv.party.name,
    ref: inv.docNo,
    date: inv.docDate,
    amount: grand,
    status: "Pending",
  });
}

async function loadTrackerList(cfg) {
  const el = document.getElementById("trackerListBody_" + cfg.key);
  if (!el) return;
  if (!hasStorage()) { el.innerHTML = emptyStorageNote(); return; }
  const list = await listGet(cfg.listKey);
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="es-icon">${cfg.icon}</div><div class="es-title">Nothing here yet</div><div class="es-sub">Click "${esc(cfg.addLabel)}" to add your first entry.</div></div>`;
    return;
  }
  el.innerHTML = `<div class="tracker-list">${list.map(row => trackerRowHtml(cfg, row)).join("")}</div>`;
}

function trackerRowHtml(cfg, row) {
  const sub = cfg.subtitleFields.map(f => row[f]).filter(Boolean).map(v => {
    return v;
  }).join(" · ");
  const metas = cfg.metaFields.map(m => {
    let val = row[m.key];
    if (m.money) val = "₹" + fmtINR(val);
    else if (m.date) val = fmtDate(val);
    return `<div><span class="m-lbl">${esc(m.label)}</span><span class="m-val">${esc(val ?? "-")}</span></div>`;
  }).join("");
  const statusHtml = cfg.statusField ? `<span class="pill pill-${(cfg.statusColors && cfg.statusColors[row[cfg.statusField]]) || "neutral"}">${esc(row[cfg.statusField]||"-")}</span>` : "";
  return `
    <div class="tracker-row">
      <div class="tracker-row-main">
        <div class="tracker-row-title">${esc(row[cfg.titleField] || "Untitled")}</div>
        <div class="tracker-row-sub">${esc(sub)}</div>
      </div>
      <div class="tracker-row-meta">${metas}${statusHtml ? `<div>${statusHtml}</div>` : ""}</div>
      <div class="tracker-actions">
        <button class="btn btn-secondary btn-sm" onclick='openTrackerModal("${cfg.key}", ${JSON.stringify(row.id)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick='deleteTrackerRow("${cfg.key}", ${JSON.stringify(row.id)})'>Delete</button>
      </div>
    </div>`;
}

async function openTrackerModal(toolId, editId) {
  const cfg = TRACKER_CONFIGS[toolId];
  let row = { id: null };
  if (editId) {
    const list = await listGet(cfg.listKey);
    row = list.find(x => x.id === editId) || row;
  }
  let m = document.getElementById("jbtModal");
  if (!m) { m = document.createElement("div"); m.id = "jbtModal"; m.className = "modal-overlay"; document.body.appendChild(m); }
  const fieldsHtml = cfg.fields.map(f => {
    const val = row[f.key] != null ? row[f.key] : (f.type === "date" ? todayISO() : "");
    if (f.type === "select") {
      return `<label class="field"><span class="label">${esc(f.label)}</span>
        <select id="tf_${f.key}">${f.options.map(o => `<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>
      </label>`;
    }
    if (f.type === "textarea") {
      return `<label class="field"><span class="label">${esc(f.label)}</span><textarea id="tf_${f.key}" rows="3">${esc(val)}</textarea></label>`;
    }
    return `<label class="field"><span class="label">${esc(f.label)}</span>
      <input id="tf_${f.key}" type="${f.type==='number'?'number':f.type==='date'?'date':'text'}" value="${esc(val)}" placeholder="${esc(f.placeholder||"")}" />
    </label>`;
  }).join("");
  m.innerHTML = `
    <div class="modal-box" style="max-width:520px">
      <p class="modal-title">${editId ? "Edit" : "Add"} — ${esc(cfg.title)}</p>
      ${fieldsHtml}
      <div class="modal-btns">
        <button class="btn btn-secondary btn-sm" id="jbtModalCancel">Cancel</button>
        <button class="btn btn-primary btn-sm" id="jbtModalOk">Save</button>
      </div>
    </div>`;
  m.style.display = "flex";
  document.getElementById("jbtModalCancel").onclick = () => { m.style.display = "none"; };
  document.getElementById("jbtModalOk").onclick = async () => {
    const missing = [];
    const newRow = { id: row.id || newId(cfg.key) };
    cfg.fields.forEach(f => {
      const el = document.getElementById("tf_" + f.key);
      const v = el.value;
      if (f.required && !String(v).trim()) missing.push(f.label);
      newRow[f.key] = f.type === "number" ? Number(v) || 0 : v;
    });
    if (missing.length) { showModal({ title: "Please fill in:", lines: missing, confirmText: "OK" }); return; }
    m.style.display = "none";
    await listUpsert(cfg.listKey, newRow);
    toast("✔ Saved");
    loadTrackerList(cfg);
  };
}
function deleteTrackerRow(toolId, id) {
  const cfg = TRACKER_CONFIGS[toolId];
  showModal({
    title: "Delete this entry?", message: "This cannot be undone.",
    confirmText: "Delete", cancelText: "Cancel",
    onConfirm: async () => { await listDelete(cfg.listKey, id); loadTrackerList(cfg); }
  });
}

/* ---------- GST Calculator ---------- */
function openGstCalc() {
  window.__jbtAfterRender = () => gstCalcUpdate();
  return calcHeader("🧾","GST Calculator","Add or remove GST from any amount instantly.") + `
    <div class="panel">
      <div class="field-row2">
        <label class="field"><span class="label">Amount (₹)</span><input id="gst_amt" type="number" value="10000" oninput="gstCalcUpdate()" /></label>
        <label class="field"><span class="label">GST Rate</span>
          <select id="gst_rate" onchange="gstCalcUpdate()">
            ${[0,0.25,3,5,12,18,28].map(r=>`<option value="${r}" ${r===18?"selected":""}>${r}%</option>`).join("")}
          </select>
        </label>
      </div>
      <label class="field"><span class="label">Calculation Type</span>
        <select id="gst_mode" onchange="gstCalcUpdate()">
          <option value="add">Add GST (amount is exclusive of GST)</option>
          <option value="remove">Remove GST (amount is inclusive of GST)</option>
        </select>
      </label>
    </div>
    <div class="panel" id="gstResult"></div>
  `;
}
function gstCalcUpdate() {
  const amt = Number(document.getElementById("gst_amt").value) || 0;
  const rate = Number(document.getElementById("gst_rate").value) || 0;
  const mode = document.getElementById("gst_mode").value;
  let base, gstAmt, total;
  if (mode === "add") { base = amt; gstAmt = base * rate/100; total = base + gstAmt; }
  else { total = amt; base = total / (1 + rate/100); gstAmt = total - base; }
  document.getElementById("gstResult").innerHTML = `
    <div class="result-box">
      <div class="result-value">₹${fmtINR(total)}</div>
      <div class="result-label">Total ${mode==='add'?'(incl. GST)':'amount'}</div>
      <div class="result-grid">
        <div class="rg-item"><div class="rg-val">₹${fmtINR(base)}</div><div class="rg-lbl">Taxable Amount</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(gstAmt)}</div><div class="rg-lbl">GST Amount (${rate}%)</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(gstAmt/2)}</div><div class="rg-lbl">CGST (if intra-state)</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(gstAmt/2)}</div><div class="rg-lbl">SGST (if intra-state)</div></div>

}

/* ---------- Tax Calculator (individual income, new vs old regime, simplified) ---------- */
function openTaxCalc() {
  window.__jbtAfterRender = () => taxCalcUpdate();
  return calcHeader("💼","Tax Calculator","Rough estimate of income tax — old vs new regime.") + `
    <div class="panel">
      <label class="field"><span class="label">Annual Income (₹)</span><input id="tax_income" type="number" value="1200000" oninput="taxCalcUpdate()" /></label>
      <label class="field"><span class="label">Deductions (80C, 80D, etc. — old regime only)</span><input id="tax_ded" type="number" value="150000" oninput="taxCalcUpdate()" /></label>
    </div>
    <div class="panel" id="taxResult"></div>
    <p class="section-note">This is a simplified estimate for planning purposes only, based on FY2025-26 slabs. Please confirm with a tax professional for filing.</p>
  `;
}
function slabTaxNew(income) {
  const slabs = [[400000,0],[400000,5],[400000,10],[400000,15],[400000,20],[400000,25],[Infinity,30]];
  let remaining = Math.max(0, income - 400000), tax = 0, lower = 400000;
  const brackets = [[800000,5],[1200000,10],[1600000,15],[2000000,20],[2400000,25],[Infinity,30]];
  let prev = 400000;
  for (const [upto, rate] of brackets) {
    if (income > prev) {
      const taxableInBracket = Math.min(income, upto) - prev;
      tax += taxableInBracket * rate/100;
      prev = upto;
    }
  }
  return Math.max(0, tax);
}
function slabTaxOld(income) {
  let tax = 0, prev = 250000;
  const brackets = [[500000,5],[1000000,20],[Infinity,30]];
  for (const [upto, rate] of brackets) {
    if (income > prev) {
      const taxableInBracket = Math.min(income, upto) - prev;
      tax += taxableInBracket * rate/100;
      prev = upto;
    }
  }
  return Math.max(0, tax);
}
function taxCalcUpdate() {
  const income = Number(document.getElementById("tax_income").value) || 0;
  const ded = Number(document.getElementById("tax_ded").value) || 0;
  const newRegimeTaxable = Math.max(0, income - 75000); // standard deduction approx
  const oldRegimeTaxable = Math.max(0, income - 50000 - ded);
  let newTax = slabTaxNew(newRegimeTaxable);
  if (newRegimeTaxable <= 1200000) newTax = 0; // rebate 87A approx
  let oldTax = slabTaxOld(oldRegimeTaxable);
  if (oldRegimeTaxable <= 500000) oldTax = 0;
  const newCess = newTax * 0.04, oldCess = oldTax * 0.04;
  const better = (newTax+newCess) <= (oldTax+oldCess) ? "New Regime" : "Old Regime";
  document.getElementById("taxResult").innerHTML = `
    <div class="result-box">
      <div class="result-value">${esc(better)}</div>
      <div class="result-label">Looks like the better option here</div>
      <div class="result-grid">
        <div class="rg-item"><div class="rg-val">₹${fmtINR(newTax+newCess)}</div><div class="rg-lbl">New Regime Tax (incl. cess)</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(oldTax+oldCess)}</div><div class="rg-lbl">Old Regime Tax (incl. cess)</div></div>
      </div>
    </div>`;
}

function profitCalcUpdate() {
  const cost = Number(document.getElementById("pf_cost").value) || 0;
  const sell = Number(document.getElementById("pf_sell").value) || 0;
  const qty = Number(document.getElementById("pf_qty").value) || 1;
  const profitPerUnit = sell - cost;
  const totalProfit = profitPerUnit * qty;
  const margin = sell > 0 ? (profitPerUnit / sell) * 100 : 0;
  const markup = cost > 0 ? (profitPerUnit / cost) * 100 : 0;
  document.getElementById("profitResult").innerHTML = `
    <div class="result-box">

/* ---------- EMI Calculator ---------- */
function openEmiCalc() {
  window.__jbtAfterRender = () => emiCalcUpdate();
  return calcHeader("🏦","EMI Calculator","Monthly instalment, broken down clearly.") + `
    <div class="panel">
      <label class="field"><span class="label">Loan Amount (₹)</span><input id="emi_p" type="number" value="500000" oninput="emiCalcUpdate()" /></label>
      <div class="field-row2">
        <label class="field"><span class="label">Interest Rate (% p.a.)</span><input id="emi_r" type="number" value="10.5" step="0.1" oninput="emiCalcUpdate()" /></label>
        <label class="field"><span class="label">Tenure (months)</span><input id="emi_n" type="number" value="36" oninput="emiCalcUpdate()" /></label>
      </div>
    </div>
    <div class="panel" id="emiResult"></div>
  `;
}
function emiCalcUpdate() {
  const p = Number(document.getElementById("emi_p").value) || 0;
  const annualRate = Number(document.getElementById("emi_r").value) || 0;
  const n = Number(document.getElementById("emi_n").value) || 1;
  const r = annualRate / 12 / 100;
  let emi;
  if (r === 0) emi = p / n;
  else emi = p * r * Math.pow(1+r,n) / (Math.pow(1+r,n) - 1);
  const totalPay = emi * n;
  const totalInterest = totalPay - p;
  document.getElementById("emiResult").innerHTML = `
    <div class="result-box">
      <div class="result-value">₹${fmtINR(emi)}</div>
      <div class="result-label">Monthly EMI</div>
      <div class="result-grid">
        <div class="rg-item"><div class="rg-val">₹${fmtINR(p)}</div><div class="rg-lbl">Principal</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(totalInterest)}</div><div class="rg-lbl">Total Interest</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(totalPay)}</div><div class="rg-lbl">Total Payment</div></div>
        <div class="rg-item"><div class="rg-val">${document.getElementById("emi_n") ? document.getElementById("emi_n").value : n} mo.</div><div class="rg-lbl">Tenure</div></div>
      </div>
    </div>`;
}

      <div class="field-row2">
        <label class="field"><span class="label">Monthly Electricity Bill Before (₹)</span><input id="sr_before" type="number" value="6000" oninput="solarRoiUpdate()" /></label>
        <label class="field"><span class="label">Monthly Electricity Bill After (₹)</span><input id="sr_after" type="number" value="800" oninput="solarRoiUpdate()" /></label>
      </div>
      <label class="field"><span class="label">Expected System Life (years)</span><input id="sr_life" type="number" value="25" oninput="solarRoiUpdate()" /></label>
    </div>
    <div class="panel" id="solarRoiResult"></div>
  `;
}
function solarRoiUpdate() {
  const cost = Number(document.getElementById("sr_cost").value) || 0;
  const before = Number(document.getElementById("sr_before").value) || 0;
  const after = Number(document.getElementById("sr_after").value) || 0;
  const life = Number(document.getElementById("sr_life").value) || 25;
  const monthlySaving = Math.max(0, before - after);
  const annualSaving = monthlySaving * 12;
  const paybackYears = annualSaving > 0 ? cost / annualSaving : 0;
  const lifetimeSavings = (annualSaving * life) - cost;
  document.getElementById("solarRoiResult").innerHTML = `
    <div class="result-box">
      <div class="result-value">${paybackYears>0 ? paybackYears.toFixed(1)+" yrs" : "—"}</div>
      <div class="result-label">Payback Period</div>
      <div class="result-grid">
        <div class="rg-item"><div class="rg-val">₹${fmtINR(monthlySaving)}</div><div class="rg-lbl">Monthly Saving</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(annualSaving)}</div><div class="rg-lbl">Annual Saving</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(lifetimeSavings)}</div><div class="rg-lbl">Lifetime Savings (${life}y)</div></div>
        <div class="rg-item"><div class="rg-val">${((annualSaving/cost)*100 || 0).toFixed(1)}%</div><div class="rg-lbl">Annual Return</div></div>
      </div>
    </div>`;
}

/* ---------- Dealer Commission Calculator ---------- */
function openCommissionCalc() {
  window.__jbtAfterRender = () => commissionCalcUpdate();
  return calcHeader("🤝","Commission Calculator","Work out dealer / agent commission quickly.") + `
    <div class="panel">
      <div class="field-row2">
        <label class="field"><span class="label">Sale Value (₹)</span><input id="cm_sale" type="number" value="100000" oninput="commissionCalcUpdate()" /></label>
        <label class="field"><span class="label">Commission Rate (%)</span><input id="cm_rate" type="number" value="5" step="0.1" oninput="commissionCalcUpdate()" /></label>
      </div>
      <label class="field"><span class="label">TDS on Commission (%, if applicable)</span><input id="cm_tds" type="number" value="5" step="0.1" oninput="commissionCalcUpdate()" /></label>
    </div>
    <div class="panel" id="commissionResult"></div>
  `;
}
function commissionCalcUpdate() {
  const sale = Number(document.getElementById("cm_sale").value) || 0;
  const rate = Number(document.getElementById("cm_rate").value) || 0;
  const tdsRate = Number(document.getElementById("cm_tds").value) || 0;
  const commission = sale * rate / 100;
  const tds = commission * tdsRate / 100;
  const net = commission - tds;
  document.getElementById("commissionResult").innerHTML = `
    <div class="result-box">
      <div class="result-value">₹${fmtINR(net)}</div>
      <div class="result-label">Net Commission Payable</div>
      <div class="result-grid">
        <div class="rg-item"><div class="rg-val">₹${fmtINR(commission)}</div><div class="rg-lbl">Gross Commission</div></div>
        <div class="rg-item"><div class="rg-val">₹${fmtINR(tds)}</div><div class="rg-lbl">TDS Deducted</div></div>
      </div>
    </div>`;
}

</script>
<script>
/* =======================================================================
   QR Code Scanner / Generator
   ======================================================================= */
let QR_MODE = "generate";
let QR_STREAM = null;

function openQrTool() {
  window.__jbtAfterRender = () => { if (QR_MODE === "generate") qrGenUpdate(); };
  return `
    <div class="tool-header">
      <button class="back-btn" onclick="go('home')">←</button>
      <div class="tool-header-text">
        <div class="tool-header-title">🔳 QR Code Scanner</div>
        <div class="tool-header-sub">Generate a QR code, or scan one with your camera or an image.</div>
      </div>
    </div>
    <div class="btn-row" style="margin-bottom:14px">
      <button class="btn ${QR_MODE==='generate'?'btn-primary':'btn-secondary'}" onclick="qrSwitchMode('generate')">✨ Generate</button>
      <button class="btn ${QR_MODE==='scan'?'btn-primary':'btn-secondary'}" onclick="qrSwitchMode('scan')">📷 Scan</button>
    </div>
    <div id="qrBody">${QR_MODE === "generate" ? qrGenerateHtml() : qrScanHtml()}</div>
  `;
}
function qrSwitchMode(mode) {
  qrStopCamera();
  QR_MODE = mode;
  const body = document.getElementById("qrBody");
  document.querySelectorAll(".tool-header ~ .btn-row .btn").forEach(()=>{});
  rerenderQrScreen();
}
function rerenderQrScreen() {
  const shell = document.getElementById("pageShell");
  if (shell) { shell.innerHTML = openQrTool(); }
}

function qrGenerateHtml() {
  return `
    <div class="panel">
      <label class="field"><span class="label">Text, URL, or UPI details</span>
        <textarea id="qr_text" rows="3" placeholder="e.g. https://justx.example.com or upi://pay?pa=you@bank" oninput="qrGenUpdate()">${esc(PROFILE.businessName ? "Business: " + PROFILE.businessName : "")}</textarea>
      </label>
      <div style="display:flex;justify-content:center;padding:20px;background:#fff;border-radius:12px;margin-top:8px">
        <div id="qrCodeBox"></div>
      </div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px" onclick="qrDownload()">⬇ Download QR Image</button>
    </div>
  `;
}
function qrGenUpdate() {
  const text = document.getElementById("qr_text").value || " ";
  const box = document.getElementById("qrCodeBox");
  if (!box) return;
  box.innerHTML = "";
  if (typeof QRCode === "undefined") {
    box.innerHTML = `<div class="empty-state"><div class="es-icon">🔌</div><div class="es-title">QR library unavailable</div><div class="es-sub">Needs an internet connection to load.</div></div>`;
    return;
  }
  try { new QRCode(box, { text: text, width: 200, height: 200, correctLevel: QRCode.CorrectLevel.M }); } catch (e) {}
}
function qrDownload() {
  const box = document.getElementById("qrCodeBox");
  const img = box.querySelector("img");
  const canvas = box.querySelector("canvas");
  const src = img ? img.src : (canvas ? canvas.toDataURL("image/png") : null);
  if (!src) { toast("QR not ready yet."); return; }
  const a = document.createElement("a");
  a.href = src; a.download = "qr-code.png"; a.click();
}

function qrScanHtml() {
  return `
    <div class="panel">
      <div class="btn-row" style="margin-bottom:14px">
        <button class="btn btn-primary" style="flex:1" onclick="qrStartCamera()">📷 Use Camera</button>
        <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('qrUploadInput').click()">🖼 Upload Image</button>
        <input type="file" id="qrUploadInput" accept="image/*" style="display:none" onchange="qrHandleUpload(event)" />
      </div>
      <div id="qrScanArea" style="display:flex;justify-content:center;align-items:center;min-height:220px;background:var(--navy-900);border-radius:12px;border:1px dashed var(--border)">
        <span style="color:var(--text-low);font-size:12.5px">Choose "Use Camera" or "Upload Image" to scan a QR code.</span>
      </div>
      <div id="qrScanResult"></div>
    </div>
  `;
}
async function qrStartCamera() {
  const area = document.getElementById("qrScanArea");
  if (typeof jsQR === "undefined") {
    area.innerHTML = `<div class="empty-state"><div class="es-icon">🔌</div><div class="es-title">Scanner library unavailable</div><div class="es-sub">Needs an internet connection to load.</div></div>`;
    return;
  }
  try {
    QR_STREAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    area.innerHTML = `<div class="empty-state"><div class="es-icon">🚫</div><div class="es-title">Camera unavailable</div><div class="es-sub">Allow camera access, or use "Upload Image" instead.</div></div>`;
    return;
  }
  area.innerHTML = `<video id="qrVideo" playsinline style="width:100%;max-width:360px;border-radius:10px"></video>`;
  const video = document.getElementById("qrVideo");
  video.srcObject = QR_STREAM;
  video.play();
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  function tick() {
    if (!QR_STREAM) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) { qrScanFound(code.data); return; }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function qrStopCamera() {
  if (QR_STREAM) { QR_STREAM.getTracks().forEach(t => t.stop()); QR_STREAM = null; }
}
function qrScanFound(data) {
  qrStopCamera();
  document.getElementById("qrScanResult").innerHTML = `
    <div class="result-box" style="margin-top:14px">
      <div class="result-label">Scanned Result</div>
      <div style="word-break:break-all;font-size:13px;font-weight:700;margin-top:6px">${esc(data)}</div>
      <button class="btn btn-secondary btn-sm" style="margin-top:10px" onclick="navigator.clipboard && navigator.clipboard.writeText('${esc(data).replace(/'/g,"\\'")}'); toast('Copied to clipboard')">📋 Copy</button>
    </div>`;
}
function qrHandleUpload(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  if (typeof jsQR === "undefined") {
    document.getElementById("qrScanArea").innerHTML = `<div class="empty-state"><div class="es-icon">🔌</div><div class="es-title">Scanner library unavailable</div></div>`;
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      document.getElementById("qrScanArea").innerHTML = `<img src="${e.target.result}" style="max-width:100%;max-height:220px;border-radius:10px" />`;
      if (code && code.data) qrScanFound(code.data);
      else toast("No QR code found in that image.");
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

</script>
<script>

   Tool registry — maps tool id to its render function

const TOOL_RENDERERS = {

  salesorder: (p) => openDocumentTool("salesorder", p),
  invoice: (p) => openDocumentTool("invoice", p),
  po: (p) => openDocumentTool("po", p),

  paymenttracker: () => openTrackerTool("paymenttracker"),
  vendors: () => openTrackerTool("vendors"),
  stock: () => openTrackerTool("stock"),
  projects: () => openTrackerTool("projects"),
  amc: () => openTrackerTool("amc"),
  servicetasks: () => openTrackerTool("servicetasks"),
  installation: () => openTrackerTool("installation"),
  sitesurvey: () => openTrackerTool("sitesurvey"),
  pricelist: () => openTrackerTool("pricelist"),

  targettracker: () => openTrackerTool("targettracker"),

  visitors: () => openTrackerTool("visitors"),

  gstcalc: openGstCalc,
  tdscalc: openTdsCalc,
  taxcalc: openTaxCalc,
  profitcalc: openProfitCalc,
  emicalc: openEmiCalc,
  loancalc: openLoanCalc,
  solarroi: openSolarRoiCalc,
  dealercommission: openCommissionCalc,

  qrscanner: () => { QR_MODE = "generate"; return openQrTool(); },
};

/* ---------------- notifications feed (derived from saved records) ---------------- */
async function loadNotificationsList() {
  const el = document.getElementById("notifList");
  if (!el) return;
  if (!hasStorage()) { el.innerHTML = emptyStorageNote(); return; }
  const items = [];
  const amc = await listGet("jbt:amc:list");
  amc.forEach(a => {
    if (a.renewalDate) {
      const days = Math.ceil((new Date(a.renewalDate) - new Date()) / 86400000);
      if (days <= 30) items.push({ icon: "🛠️", text: `AMC renewal for ${a.client} ${days<0?"is overdue":"due in "+days+" day(s)"}`, date: a.renewalDate, urgent: days < 7 });
    }
  });
  const pay = await listGet("jbt:paymenttracker:list");
  pay.forEach(p => {
    if (p.status === "Overdue" || p.status === "Pending") items.push({ icon: "💰", text: `${p.kind} of ₹${fmtINR(p.amount)} from ${p.party} is ${p.status.toLowerCase()}`, date: p.date, urgent: p.status === "Overdue" });
  });
  const visitors = await listGet("jbt:visitors:list");
  visitors.forEach(v => {
    if (v.status === "Scheduled" && v.date >= todayISO()) items.push({ icon: "🗓️", text: `Appointment with ${v.name} on ${fmtDate(v.date)}`, date: v.date, urgent: false });
  });
  const tasks = await listGet("jbt:servicetasks:list");
  tasks.forEach(t => {
    if (t.status !== "Completed" && t.dueDate) items.push({ icon: "🔧", text: `Service task "${t.title}" due ${fmtDate(t.dueDate)}`, date: t.dueDate, urgent: t.dueDate < todayISO() });
  });
  items.sort((a,b) => (a.date||"").localeCompare(b.date||""));
  if (!items.length) {
    el.innerHTML = `<div class="empty-state"><div class="es-icon">🔔</div><div class="es-title">All caught up</div><div class="es-sub">Reminders from AMC, Payments, Visitors, and Service Tasks will appear here.</div></div>`;
    return;
  }
  el.innerHTML = `<div class="tracker-list">${items.map(i => `
    <div class="tracker-row">
      <div class="tracker-row-main">
        <div class="tracker-row-title">${i.icon} ${esc(i.text)}</div>
      </div>
      <div class="tracker-row-meta"><span class="pill pill-${i.urgent?'danger':'neutral'}">${i.urgent?'Urgent':'Upcoming'}</span></div>
    </div>
  `).join("")}</div>`;
}

/* ---------------- bootstrap ---------------- */
window.__jbtAfterRenderNotif = null;
const _origRender = render;
render = function() {
  _origRender();
  if (route.screen === "notifications") loadNotificationsList();
};

async function bootstrap() {
  await loadProfile();
  render();
}
bootstrap();

</script>
