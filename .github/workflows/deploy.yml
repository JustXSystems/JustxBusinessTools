# Deploy JBT to Hostinger VPS (build on GitHub → slim artifact → PM2)
#
# Required GitHub Secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH
#
# Single job (no artifact upload/download round-trip). Slim tarball omits
# node_modules and the ~28MB Windows agent zip (preserved on VPS).
#
# See docs/DEPLOY.md

name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "e2e/**"
      - "android/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      deploy_enabled:
        description: "Deploy to VPS after build"
        type: boolean
        default: true
      run_migrations:
        description: "Apply pending DB migrations (on stage, before swap)"
        type: boolean
        default: true
      backup_db:
        description: "Run MySQL backup before migrations"
        type: boolean
        default: false
      seed_tools:
        description: "Re-seed tool definitions catalog"
        type: boolean
        default: false
      pack_win_agent:
        description: "Rebuild+ship JustX-Sync-Agent-win-x64.zip (~28MB, slow)"
        type: boolean
        default: false
      force_cache_rebuild:
        description: "Delete+rebuild CI caches (npm/Next/SWC/agent) and force VPS npm ci"
        type: boolean
        default: false
      pm2_mode:
        description: "PM2 apply mode after release"
        type: choice
        options:
          - reload
          - restart
          - restart_api
          - restart_web
          - restart_worker
          - none
        default: reload
      post_deploy_task:
        description: "Allowlisted post-deploy task (seed_admin is rare/dangerous)"
        type: choice
        options:
          - none
          - seed_tools
          - seed_admin
          - analytics_rollup
        default: none
      health_check:
        description: "Run post-deploy API + web health probes"
        type: boolean
        default: true
      auto_rollback:
        description: "Restore previous live tree if health fails after swap"
        type: boolean
        default: true
      keep_releases:
        description: "Release folders to retain on VPS"
        type: choice
        options:
          - "3"
          - "5"
          - "10"
        default: "3"

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  NODE_VERSION: "20"
  NEXT_PUBLIC_BASE_PATH: /jbt
  WEB_BASE_PATH: /jbt
  JBT_SKIP_WIN_AGENT_PACK: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RUN_MIGRATIONS: ${{ inputs.run_migrations != false }}
      BACKUP_DB: ${{ inputs.backup_db == true }}
      SEED_TOOLS: ${{ inputs.seed_tools == true }}
      PM2_MODE: ${{ inputs.pm2_mode || 'reload' }}
      POST_DEPLOY_TASK: ${{ inputs.post_deploy_task || 'none' }}
      HEALTH_CHECK: ${{ inputs.health_check != false }}
      AUTO_ROLLBACK: ${{ inputs.auto_rollback != false }}
      KEEP_RELEASES: ${{ inputs.keep_releases || '3' }}
      DO_DEPLOY: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy_enabled }}
      PACK_WIN_AGENT: ${{ inputs.pack_win_agent == true }}
      FORCE_CACHE_REBUILD: ${{ inputs.force_cache_rebuild == true }}
      FORCE_NPM_CI: ${{ inputs.force_cache_rebuild == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release id
        id: meta
        run: echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Delete Actions caches (force rebuild)
        if: ${{ env.FORCE_CACHE_REBUILD == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "==> force_cache_rebuild: deleting repo Actions caches"
          # Delete all caches for this repo so the next save writes fresh entries.
          mapfile -t IDS < <(gh cache list -R "${{ github.repository }}" --limit 100 --json id -q '.[].id' || true)
          if [[ ${#IDS[@]} -eq 0 ]]; then
            echo "    no caches listed"
          else
            for id in "${IDS[@]}"; do
              echo "    delete cache id=$id"
              gh cache delete "$id" -R "${{ github.repository }}" || true
            done
          fi
          rm -rf ~/.npm web/.next/cache ~/.cache/next-swc desktop-sync-agent/.runtime-cache
          echo "==> local cache dirs cleared"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Sync Agent Node win-x64 zip
        if: ${{ env.PACK_WIN_AGENT == 'true' }}
        uses: actions/cache@v4
        with:
          path: desktop-sync-agent/.runtime-cache
          key: agent-node-win-${{ runner.os }}-v20.18.1
          restore-keys: |
            agent-node-win-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Ensure Linux CSS native bindings
        run: |
          chmod +x scripts/ensure-css-native-linux.sh
          ./scripts/ensure-css-native-linux.sh

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            web/.next/cache
            ~/.cache/next-swc
          key: nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('web/**/*.js', 'web/**/*.jsx', 'web/**/*.ts', 'web/**/*.tsx', 'web/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-node${{ env.NODE_VERSION }}-

      - name: Build web (production /jbt)
        env:
          JBT_SKIP_WIN_AGENT_PACK: ${{ env.PACK_WIN_AGENT == 'true' && '0' || '1' }}
        run: npm run build -w web

      - name: Pack slim release tarball
        run: |
          chmod +x scripts/pack-release.sh
          if [[ "${{ env.PACK_WIN_AGENT }}" == "true" && -f web/public/JustX-Sync-Agent-win-x64.zip ]]; then
            echo "==> Including win agent zip in this release"
            export JBT_INCLUDE_WIN_AGENT=1
          fi
          ./scripts/pack-release.sh jbt-release.tgz
          ls -lh jbt-release.tgz
          test -f jbt-release.tgz.sha256

      - name: Upload tarball to VPS
        if: ${{ env.DO_DEPLOY == 'true' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "jbt-release.tgz,jbt-release.tgz.sha256"
          target: /tmp
          overwrite: true

      - name: Apply release over SSH
        if: ${{ env.DO_DEPLOY == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        env:
          RUN_MIGRATIONS: ${{ env.RUN_MIGRATIONS }}
          BACKUP_DB: ${{ env.BACKUP_DB }}
          SEED_TOOLS: ${{ env.SEED_TOOLS }}
          PM2_MODE: ${{ env.PM2_MODE }}
          POST_DEPLOY_TASK: ${{ env.POST_DEPLOY_TASK }}
          HEALTH_CHECK: ${{ env.HEALTH_CHECK }}
          AUTO_ROLLBACK: ${{ env.AUTO_ROLLBACK }}
          KEEP_RELEASES: ${{ env.KEEP_RELEASES }}
          FORCE_NPM_CI: ${{ env.FORCE_NPM_CI }}
          RELEASE_ID: ${{ steps.meta.outputs.short_sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          envs: RUN_MIGRATIONS,BACKUP_DB,SEED_TOOLS,PM2_MODE,POST_DEPLOY_TASK,HEALTH_CHECK,AUTO_ROLLBACK,KEEP_RELEASES,FORCE_NPM_CI,RELEASE_ID
          script: |
            set -euo pipefail
            LIVE="${{ secrets.DEPLOY_PATH }}"
            RELEASES="$(dirname "$LIVE")/jbt-releases"
            SHARED="$(dirname "$LIVE")/jbt-shared"
            mkdir -p "$RELEASES/incoming" "$SHARED"
            TGZ_SRC="/tmp/jbt-release.tgz"
            SUM_SRC="/tmp/jbt-release.tgz.sha256"
            test -f "$TGZ_SRC"
            test -f "$SUM_SRC"
            TGZ="$RELEASES/incoming/jbt-release-${RELEASE_ID}.tgz"
            SUM="$TGZ.sha256"
            mv -f "$TGZ_SRC" "$TGZ"
            mv -f "$SUM_SRC" "$SUM"
            TMP="$(mktemp -d)"
            tar -xzf "$TGZ" -C "$TMP" scripts/vps-release.sh scripts/vps-healthcheck.sh
            chmod +x "$TMP/scripts/vps-release.sh" "$TMP/scripts/vps-healthcheck.sh"
            export RELEASE_TGZ="$TGZ"
            export RELEASE_SHA256="$SUM"
            export DEPLOY_PATH="$LIVE"
            export RELEASES_DIR="$RELEASES"
            export SHARED_DIR="$SHARED"
            export RELEASE_ID
            export RUN_MIGRATIONS
            export BACKUP_DB
            export SEED_TOOLS
            export PM2_MODE
            export POST_DEPLOY_TASK
            export HEALTH_CHECK
            export AUTO_ROLLBACK
            export KEEP_RELEASES
            export FORCE_NPM_CI
            "$TMP/scripts/vps-release.sh"
            rm -rf "$TMP"
