# =============================================================================
# JustX Systems — project registry
# Each [section] is an isolated deployable app under justxsystems.com
# Ports must be unique across projects. BASE_PATH is the public URL prefix.
# =============================================================================

[jbt]
NAME=JustX Business Tools
DOMAIN=justxsystems.com
BASE_PATH=/jbt
WEB_PORT=3002
API_PORT=4002
REPO_URL=https://github.com/JustXSystems/JustxBusinessTools.git
REPO_BRANCH=main
DB_NAME=justx_systems
DB_USER=justx_user
APP_DIR=/opt/justx/apps/jbt
HEALTH_PATHS=/jbt,/jbt/api/health
SQL_FILES=mysql/init.sql mysql/jbt_schema.sql mysql/admin_schema.sql mysql/auth_extensions.sql mysql/admin_platform.sql mysql/artifact_delivery_schema.sql mysql/notifications_schema.sql
SEED_CMD=npm run db:seed -w server && npm run db:seed:tools -w server

# Existing on this VPS (managed outside this toolkit / reserved ports):
# Zigma Technologies — web already on :3001 — do not reuse WEB_PORT=3001 for JBT
#
# [zigma-technologies]
# NAME=Zigma Technologies
# DOMAIN=justxsystems.com
